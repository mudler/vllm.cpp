{{ define "main" }}
<article class="doc">
  <p class="doc-kicker">vllm.cpp</p>
  <h1>Documentation</h1>
  <div class="lede">{{ .Content }}</div>

  <ul class="cards">
    {{ range $i, $e := site.Data.nav.docs }}
      {{ $slug := lower (strings.TrimSuffix ".md" $e.file) }}
      <li>
        <a href="{{ printf "docs/%s/" $slug | relURL }}">
          <span class="num">{{ printf "%02d" (add $i 1) }}</span>
          <span>{{ $e.label }}<span class="desc">docs/{{ $e.file }}</span></span>
        </a>
      </li>
    {{ end }}
  </ul>
</article>
{{ end }}
